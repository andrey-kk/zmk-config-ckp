# GitHub Actions build matrix for ZMK's reusable "build-user-config" workflow.
# `bt60@2.0.0//zmk` = ZMK's in-tree Polarity Works BT60 board, revision 2.0.0
# (the CKP PCB), ZMK variant. Firmware is uploaded as `bt60.uf2`.
---
include:
  - board: bt60@2.0.0//zmk
    artifact-name: bt60
  # Recovery firmware: flash to wipe stored BT pairings/settings, then flash bt60.uf2 again.
  - board: bt60@2.0.0//zmk
    shield: settings_reset
    artifact-name: bt60-settings-reset
