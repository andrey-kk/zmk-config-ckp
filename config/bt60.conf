# User Kconfig for the BT60 (CKP PCB). Applied on top of ZMK's in-tree
# `bt60` board defaults. See README.md ("Power saving") for details.

# --- Bluetooth -------------------------------------------------------------
# Connection-stability tweaks (kept from the upstream PolarityWorks config).
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Security tweaks: lets a host re-pair even if stale pairing keys exist on
# either side. Fixes macOS "Connect does nothing" after a reflash/BT_CLR.
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# --- Idle / deep sleep -----------------------------------------------------
# After 30 s without a keypress the keyboard goes "idle": RGB underglow and
# backlight switch off (they come back on the next keypress).
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# After 15 min without a keypress the keyboard enters deep sleep. Any key
# press wakes it (the key matrix is a wakeup source); the first press is used
# to wake up and is not sent. BLE reconnects automatically after wake.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Lighting defaults -----------------------------------------------------
# Underglow no longer turns on at every boot; toggle it with Fn+R.
# (The last on/off state is remembered across reboots.)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Backlight brightness steps (Fn+K / Fn+L), as in the upstream tsangan config.
CONFIG_ZMK_BACKLIGHT_BRT_START=10
CONFIG_ZMK_BACKLIGHT_BRT_STEP=10

# --- Encoders --------------------------------------------------------------
# No rotary encoders are fitted; their devicetree nodes are disabled in
# bt60.keymap, so the EC11 driver is not needed.
CONFIG_EC11=n
